[project]
name = "gymschedulebot"
version = "0.1.0"
description = "A workout planner that reads your calendar and adapts your training split to how busy your week is."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Form()/File() defaults are the documented pattern.
ignore = ["B008"]
